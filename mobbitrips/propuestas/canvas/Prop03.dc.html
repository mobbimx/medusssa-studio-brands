<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@300;400;700&family=Nunito+Sans:wght@400;600;700;800&display=swap">
<style>
  body{margin:0;}
  a{color:#ED6864;} a:hover{color:#D2524E;}
  *{box-sizing:border-box;}
</style>
</helmet>
<div style="width:1080px;height:1920px;background:#E4DDD9;color:#2B2523;position:relative;font-family:'Nunito Sans',system-ui,sans-serif;overflow:hidden;">

  <!-- Photo zone -->
  <div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;">
    <svg width="70" height="70" viewBox="0 0 24 24" fill="none" stroke="#ADA39D" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
    <div style="font-weight:800;font-size:23px;letter-spacing:.14em;color:#867D78;text-transform:uppercase;">Foto real</div>
    <div style="font-weight:500;font-size:26px;color:#948B86;max-width:60%;">Entrada / puerta de la propiedad</div>
  </div>

  <!-- Safe-zone guides (solo referencia) -->
  <div style="position:absolute;top:250px;left:0;right:0;border-top:1px dashed rgba(112,111,111,.35);"></div>
  <div style="position:absolute;bottom:230px;left:0;right:0;border-top:1px dashed rgba(112,111,111,.35);"></div>

  <!-- Content -->
  <div style="position:absolute;inset:0;padding:270px 70px 250px;display:flex;flex-direction:column;justify-content:space-between;">
    <div style="display:flex;flex-direction:column;align-items:center;gap:14px;">
      <div style="font-family:'Comfortaa','Trebuchet MS',system-ui,sans-serif;font-weight:300;font-size:32px;color:#ED6864;">mobbitrips</div>
      <div style="font-weight:800;font-size:26px;letter-spacing:.2em;text-transform:uppercase;color:#706F6F;">Tu llegada</div>
    </div>

    <div style="background:rgba(251,248,246,.9);border-radius:28px;padding:52px 44px;text-align:center;">
      <div style="font-family:'Comfortaa','Trebuchet MS',system-ui,sans-serif;font-weight:700;font-size:82px;line-height:1.05;">Abre la<br>puerta<span style="color:#ED6864;">…</span></div>
      <div style="margin-top:22px;font-size:34px;font-weight:500;color:#5F5854;">…y esto es lo primero que ves.</div>
    </div>

    <div style="display:flex;flex-direction:column;gap:34px;align-items:center;">
      <div style="display:flex;align-items:center;gap:18px;font-weight:700;font-size:26px;color:#5F5854;">
        <span style="background:#ED6864;color:#fff;padding:8px 20px;border-radius:999px;">Puerta</span>
        <span style="color:#B4ABA6;">→</span>
        <span style="background:rgba(251,248,246,.85);padding:8px 20px;border-radius:999px;">Apertura</span>
        <span style="color:#B4ABA6;">→</span>
        <span style="background:rgba(251,248,246,.85);padding:8px 20px;border-radius:999px;">Espacio</span>
      </div>
      <div style="display:inline-flex;align-items:center;gap:12px;background:#ED6864;color:#fff;font-weight:800;font-size:28px;padding:18px 34px;border-radius:999px;">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-8.5 8.5 8.5 8.5 0 0 1-3.6-.8L3 21l1.8-5.4A8.5 8.5 0 1 1 21 11.5z"/></svg>
        Ven a verlo · WhatsApp
      </div>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
