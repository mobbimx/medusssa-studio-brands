*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1350px;overflow:hidden}
.stage{position:relative;width:1080px;height:1350px;overflow:hidden;background:#F4EEE5;
  font-family:'Poppins',sans-serif;-webkit-font-smoothing:antialiased}

/* fondos */
.curvas{position:absolute;top:0;left:0;opacity:.85;pointer-events:none}
.foto{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.velo{position:absolute;inset:0;background:
  radial-gradient(115% 46% at 50% 42%, rgba(40,27,20,.62) 0%, rgba(40,27,20,.28) 55%, rgba(40,27,20,0) 78%),
  linear-gradient(180deg, rgba(52,36,27,.42) 0%, rgba(52,36,27,.16) 26%,
                          rgba(52,36,27,.30) 60%, rgba(45,31,23,.74) 88%, rgba(45,31,23,.88) 100%);}
.velo.bajo{background:
  radial-gradient(120% 42% at 50% 68%, rgba(40,27,20,.64) 0%, rgba(40,27,20,.28) 55%, rgba(40,27,20,0) 80%),
  linear-gradient(180deg, rgba(52,36,27,.40) 0%, rgba(52,36,27,.14) 26%,
                          rgba(52,36,27,.34) 58%, rgba(45,31,23,.78) 88%, rgba(45,31,23,.90) 100%);}

/* logo */
.logo{position:absolute;top:52px;left:50%;transform:translateX(-50%);width:212px;z-index:3}
.logo.badge{background:rgba(255,255,255,.93);border-radius:16px;padding:16px 26px;width:264px;
  box-shadow:0 6px 26px rgba(40,26,18,.18)}

/* bloque de contenido */
.wrap{position:absolute;left:96px;right:96px;z-index:2}
.center{text-align:center}

.eyebrow{font-family:'Playfair Display',serif;font-weight:500;text-transform:uppercase;
  letter-spacing:11px;font-size:29px;color:#501B1F}
.eyebrow.claro{color:#EED6C4}

.titulo{font-family:'Playfair Display',serif;font-weight:700;color:#36261F;
  line-height:1.10;letter-spacing:-.3px;white-space:pre-line}
.titulo.claro{color:#F2E6D4;text-shadow:0 3px 22px rgba(30,18,12,.55)}

.titulo-fino{font-family:'Playfair Display',serif;font-weight:400;text-transform:uppercase;
  letter-spacing:12px;line-height:1.14;color:#F2E6D4;white-space:pre-line;
  text-shadow:0 3px 22px rgba(30,18,12,.5)}

.sub-italic{font-family:'Playfair Display',serif;font-style:italic;font-weight:600;
  color:#CD7638;line-height:1.38}
.sub-italic.claro{color:#EED6C4;text-shadow:0 2px 16px rgba(30,18,12,.5)}

.cuerpo{font-family:'Poppins',sans-serif;font-weight:400;color:#7A665A;line-height:1.52}
.cuerpo.claro{color:rgba(255,255,255,.92)}

.numero{font-family:'Playfair Display',serif;font-weight:700;color:#CD7638;line-height:.86}

/* listas */
.items{margin-top:40px}
.item{display:flex;align-items:flex-start;gap:26px;padding:19px 0;
  border-bottom:1.5px solid rgba(80,27,31,.13)}
.item:last-child{border-bottom:none}
.item .n{flex:0 0 auto;font-family:'Playfair Display',serif;font-weight:700;font-size:44px;
  color:#CD7638;line-height:1;width:46px;text-align:center}
.item .flor{flex:0 0 auto;width:34px;height:34px;margin-top:6px}
.item .t{font-family:'Poppins',sans-serif;font-weight:400;font-size:34px;color:#36261F;line-height:1.34}

/* chips de fecha */
.chips{display:flex;gap:26px;justify-content:center;margin-top:44px}
.chip{border:2px solid #CD7638;border-radius:20px;padding:24px 40px;background:rgba(205,118,56,.06)}
.chip .d{font-family:'Poppins',sans-serif;font-weight:600;font-size:23px;letter-spacing:5px;
  color:#CD7638;text-transform:uppercase}
.chip .n{font-family:'Playfair Display',serif;font-weight:700;font-size:76px;color:#36261F;
  line-height:1.02;margin-top:4px}

/* polaroid */
.polaroid{position:absolute;background:#fff;padding:16px 16px 46px;
  box-shadow:0 18px 44px rgba(58,40,28,.22);z-index:2}
.polaroid img{display:block;width:100%;object-fit:cover}

/* cita */
.comillas{font-family:'Playfair Display',serif;font-weight:700;font-size:150px;color:#CD7638;
  line-height:.62;height:78px}
.cita{font-family:'Playfair Display',serif;font-style:italic;font-weight:700;color:#36261F;
  line-height:1.30}
.estrellas{color:#FC561D;font-size:44px;letter-spacing:8px}
.nombre{font-family:'Playfair Display',serif;font-weight:500;text-transform:uppercase;
  letter-spacing:10px;color:#501B1F}

/* CTA pill */
.pill{display:inline-flex;align-items:center;gap:20px;border:2.5px solid rgba(255,255,255,.9);
  border-radius:60px;padding:22px 48px;color:#fff;font-family:'Poppins',sans-serif;
  font-weight:600;font-size:31px;letter-spacing:1.5px}
.pill.oscuro{border-color:#501B1F;color:#501B1F}

/* dots */
.dots{position:absolute;bottom:118px;left:0;right:0;display:flex;gap:20px;justify-content:center;z-index:3}
.dots span{width:13px;height:13px;border-radius:50%;background:#DCD2C6}
.dots span.on{background:#CD7638}

/* barra hairline */
.barra{position:absolute;bottom:58px;left:0;right:0;z-index:3}
.barra .rule{height:1.5px;margin:0 118px 22px}
.barra .row{display:flex;align-items:center;justify-content:center;gap:18px;
  font-family:'Poppins',sans-serif;font-size:26px;font-weight:400}
.barra .row b{font-weight:700}
.barra .dot{width:7px;height:7px;border-radius:50%}

/* barra solida */
.barra-solida{position:absolute;bottom:0;left:0;right:0;height:118px;background:#4A3428;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;z-index:3}
.bs-frase{font-family:'Playfair Display',serif;font-style:italic;font-weight:600;font-size:35px;
  color:#EED6C4}
.bs-wa{font-family:'Poppins',sans-serif;font-weight:700;font-size:33px;color:#fff}

/* guia de edicion (se borra al publicar) */
.guia{position:absolute;bottom:12px;left:0;right:0;text-align:center;font-size:19px;
  font-family:'Poppins',sans-serif;font-weight:300;color:rgba(90,72,60,.45);z-index:4}
.guia span{color:#CD7638}
.guia.claro{color:rgba(255,255,255,.5)}

.wrap{ top:250px; }
.titulo{ font-size:74px; }
.cuerpo{ font-size:29px; margin-top:32px; }
.chips{ margin-top:36px; }
.chip{ padding:20px 34px; }
