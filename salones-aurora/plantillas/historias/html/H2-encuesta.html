.center{text-align:center}
.eyebrow{font-family:'Playfair Display',serif;font-weight:500;text-transform:uppercase;
  letter-spacing:11px;font-size:29px;color:#501B1F}
.eyebrow.claro{color:#EED6C4}
.titulo{font-family:'Playfair Display',serif;font-weight:700;color:#36261F;line-height:1.08;
  white-space:pre-line;letter-spacing:-.3px}
.titulo.claro{color:#F3E7D5;text-shadow:0 3px 22px rgba(30,18,12,.55)}
.cuerpo{font-weight:400;color:#7A665A;line-height:1.52}
.cuerpo.claro{color:rgba(255,255,255,.93)}
.mano{font-family:'Caveat',cursive;font-weight:600;color:#CD7638;line-height:1.22}
.mano.oscuro{color:#36261F}
.dato{font-family:'Playfair Display',serif;font-weight:700;color:#CD7638;line-height:.9}

/* etiqueta de papel (tipo scrapbook) */
.papel{position:absolute;background:#FBF6EE;padding:26px 34px;
  box-shadow:0 10px 26px rgba(58,40,28,.16);z-index:3}
.papel::after{content:"";position:absolute;left:0;right:0;bottom:-9px;height:10px;
  background:repeating-linear-gradient(-45deg,#FBF6EE 0 9px,transparent 9px 18px)}
.clip{position:absolute;width:34px;height:76px;border:5px solid #B9AFA3;border-radius:18px;
  border-bottom-color:transparent;z-index:4;transform:rotate(-8deg)}

.polaroid{position:absolute;background:#fff;padding:15px 15px 44px;
  box-shadow:0 18px 44px rgba(58,40,28,.22);z-index:3}
.polaroid img{display:block;width:100%;object-fit:cover}
.polaroid .pie{position:absolute;left:0;right:0;bottom:9px;text-align:center;
  font-family:'Caveat',cursive;font-weight:600;font-size:27px;color:#7A665A}

/* listas y tablas */
.fila{display:flex;align-items:center;justify-content:space-between;padding:17px 0;
  border-bottom:1.5px solid rgba(80,27,31,.13)}
.fila:last-child{border-bottom:none}
.fila .k{font-size:32px;color:#36261F;font-weight:400}
.fila .v{font-family:'Playfair Display',serif;font-weight:700;font-size:34px;color:#CD7638}

/* pill */
.pill{display:inline-flex;align-items:center;gap:16px;border-radius:60px;padding:22px 46px;
  font-weight:600;font-size:31px;letter-spacing:1.4px}
.pill.claro{border:2.5px solid rgba(255,255,255,.92);color:#fff}
.pill.solido{background:#501B1F;color:#fff}

/* barra de contacto */
.barra-c{position:absolute;bottom:0;left:0;right:0;background:#4A3428;z-index:6;
  display:flex;flex-direction:column;justify-content:center;gap:11px;padding:0 44px}
.bc-fila{display:flex;align-items:center;gap:34px}
.bc-it{display:inline-flex;align-items:center;gap:12px;color:#EED6C4;font-size:22px;font-weight:300}
.bc-it b{color:#fff;font-weight:700}
.bc-dir .bc-it{font-size:21px}
.bc-pago{margin-left:auto;display:inline-flex;align-items:center;gap:11px;color:#EED6C4;
  font-size:20px;font-weight:400;border:1.5px solid rgba(238,214,196,.45);
  border-radius:30px;padding:8px 18px}

.guia{position:absolute;bottom:150px;left:0;right:0;text-align:center;font-size:19px;
  font-weight:300;color:rgba(90,72,60,.45);z-index:7}
.guia.claro{color:rgba(255,255,255,.55)}
.guia span{color:#CD7638}

.pie-h{ position:absolute; bottom:250px; left:0; right:0; text-align:center; z-index:6; }
.pie-h .bc-it{ justify-content:center; font-weight:300; }
.pie-h .pie-dir{ font-size:22px; font-weight:300; margin-top:12px; opacity:.85; }
.zona{ position:absolute; left:0; right:0; }
.logo{ z-index:6; }
.wrap{ left:96px; right:96px; }

.wrap{ top:560px; }
.titulo{ font-size:76px; }
.opc{ margin-top:60px; display:flex; flex-direction:column; gap:34px; }
.opc div{ border:2.5px solid #CD7638; border-radius:26px; padding:38px 30px;
  font-family:'Playfair Display',serif; font-weight:700; font-size:52px; color:#36261F;
  background:rgba(205,118,56,.07); }
.mano{ font-size:46px; margin-top:56px; }
