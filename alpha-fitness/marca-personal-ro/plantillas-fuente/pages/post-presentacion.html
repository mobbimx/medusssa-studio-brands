<!doctype html><html lang="es"><head><meta charset="utf-8">
<style>/* ==========================================================================
   COACH RO — Sistema de marca personal · Medusssa Studio
   Hoja de estilos compartida para plantillas de historias y overlays.
   ========================================================================== */

@font-face { font-family:'Fredoka'; src:url('../fonts/Fredoka-Bold.ttf'); font-weight:600 700; }
@font-face { font-family:'Baloo 2'; src:url('../fonts/Baloo2.ttf'); font-weight:400 800; }
@font-face { font-family:'Poppins'; src:url('../fonts/Poppins-Regular.ttf'); font-weight:400; }
@font-face { font-family:'Poppins'; src:url('../fonts/Poppins-SemiBold.ttf'); font-weight:600; }
@font-face { font-family:'Poppins'; src:url('../fonts/Poppins-Bold.ttf'); font-weight:700; }
@font-face { font-family:'Nunito'; src:url('../fonts/Nunito.ttf'); font-weight:400 800; }

:root{
  /* Rosa Coach Ro */
  --rosa:        #FF4F97;
  --rosa-vivo:   #FF2E86;
  --rosa-pastel: #FFD9EC;
  --rosa-nube:   #FFEBF4;
  /* Arcoíris pastel */
  --lila:        #C6B2FF;
  --menta:       #9FE7DC;
  --celeste:     #B9E4FF;
  --amarillo:    #FFDE7A;
  /* Neutros */
  --crema:       #FFF7FB;
  --carbon:      #2A2028;
  --blanco:      #FFFFFF;

  --grad-arcoiris: linear-gradient(100deg,#FF4F97 0%,#C6B2FF 38%,#B9E4FF 68%,#9FE7DC 100%);
  --grad-rosa:     linear-gradient(160deg,#FF6FAC 0%,#FF2E86 100%);
  --grad-nube:     linear-gradient(165deg,#FFF7FB 0%,#FFE6F3 55%,#F3ECFF 100%);

  --sombra-suave: 0 18px 50px rgba(255,79,151,.22);
  --sombra-card:  0 22px 60px rgba(42,32,40,.16);
}

*{ box-sizing:border-box; margin:0; padding:0; -webkit-font-smoothing:antialiased; }

/* Lienzo historia 1080x1920 */
.story{
  width:1080px; height:1920px; position:relative; overflow:hidden;
  font-family:'Poppins',sans-serif; color:var(--carbon);
}

/* Utilidades tipográficas */
.display{ font-family:'Fredoka',sans-serif; font-weight:700; letter-spacing:-.5px; line-height:.98; }
.round{ font-family:'Baloo 2',sans-serif; }
.eyebrow{ font-family:'Poppins',sans-serif; font-weight:700; letter-spacing:6px; text-transform:uppercase; }

/* Marca de agua / firma */
.firma{ font-family:'Poppins'; font-weight:600; letter-spacing:2px; text-transform:uppercase; opacity:.6; font-size:20px; }

/* Sparkles */
.spark{ position:absolute; color:var(--blanco); filter:drop-shadow(0 2px 6px rgba(255,79,151,.4)); }
.post{width:1080px;height:1350px;position:relative;overflow:hidden;font-family:'Poppins',sans-serif;color:var(--carbon)}</style></head><body>
<div class="post" style="background:var(--grad-nube);padding:90px 80px;display:flex;flex-direction:column;justify-content:center">
  <svg class="spark" style="left:80px;top:120px;width:44px;height:44px;opacity:1.0;transform:rotate(0deg)" viewBox="0 0 24 24" fill="#FFD9EC"><path d="M12 0c.7 5.5 2.5 8 12 12-9.5 4-11.3 6.5-12 12-.7-5.5-2.5-8-12-12 9.5-4 11.3-6.5 12-12z"/></svg><svg class="spark" style="left:940px;top:160px;width:32px;height:32px;opacity:0.9;transform:rotate(0deg)" viewBox="0 0 24 24" fill="#C6B2FF"><path d="M12 0c.7 5.5 2.5 8 12 12-9.5 4-11.3 6.5-12 12-.7-5.5-2.5-8-12-12 9.5-4 11.3-6.5 12-12z"/></svg><svg class="spark" style="left:120px;top:1180px;width:40px;height:40px;opacity:0.8;transform:rotate(0deg)" viewBox="0 0 24 24" fill="#9FE7DC"><path d="M12 0c.7 5.5 2.5 8 12 12-9.5 4-11.3 6.5-12 12-.7-5.5-2.5-8-12-12 9.5-4 11.3-6.5 12-12z"/></svg><svg class="spark" style="left:930px;top:1200px;width:50px;height:50px;opacity:0.9;transform:rotate(0deg)" viewBox="0 0 24 24" fill="#FFD9EC"><path d="M12 0c.7 5.5 2.5 8 12 12-9.5 4-11.3 6.5-12 12-.7-5.5-2.5-8-12-12 9.5-4 11.3-6.5 12-12z"/></svg>
  <div class="eyebrow" style="font-size:26px;color:var(--rosa)">Mucho gusto, soy</div>
  <div class="display" style="font-size:190px;color:var(--carbon);margin:6px 0 0">Coach<br><span style="color:var(--rosa)">Ro</span></div>
  <div style="font-family:'Poppins';font-weight:600;font-size:40px;color:var(--carbon);opacity:.75;margin-top:24px;line-height:1.35">
    Entrenadora de danza aérea, calistenia y acondicionamiento físico para niños en Xalapa.</div>
  <div style="display:flex;gap:16px;flex-wrap:wrap;margin-top:44px">
    <span style="background:#fff;border:2px solid var(--rosa-pastel);border-radius:20px;padding:14px 26px;font-family:Poppins;font-weight:700;font-size:28px;color:var(--rosa)">15 años en telas</span><span style="background:#fff;border:2px solid var(--rosa-pastel);border-radius:20px;padding:14px 26px;font-family:Poppins;font-weight:700;font-size:28px;color:var(--rosa)">Cinta roja TKD</span><span style="background:#fff;border:2px solid var(--rosa-pastel);border-radius:20px;padding:14px 26px;font-family:Poppins;font-weight:700;font-size:28px;color:var(--rosa)">Deportista vigente</span><span style="background:#fff;border:2px solid var(--rosa-pastel);border-radius:20px;padding:14px 26px;font-family:Poppins;font-weight:700;font-size:28px;color:var(--rosa)">+10 años pesas</span>
  </div>
  <div style="margin-top:56px;font-family:'Baloo 2';font-weight:800;font-size:44px;color:var(--carbon)">
    "Entrenamos jugando y aquí está <span style="color:var(--rosa)">prohibido decir no puedo</span>."</div>
</div></body></html>
