<!doctype html><html lang="es"><head><meta charset="utf-8">
<style>/* ==========================================================================
   COACH RO — Sistema de marca personal · Medusssa Studio
   Hoja de estilos compartida para plantillas de historias y overlays.
   ========================================================================== */

@font-face { font-family:'Fredoka'; src:url('../fonts/Fredoka-Bold.ttf'); font-weight:600 700; }
@font-face { font-family:'Baloo 2'; src:url('../fonts/Baloo2.ttf'); font-weight:400 800; }
@font-face { font-family:'Poppins'; src:url('../fonts/Poppins-Regular.ttf'); font-weight:400; }
@font-face { font-family:'Poppins'; src:url('../fonts/Poppins-SemiBold.ttf'); font-weight:600; }
@font-face { font-family:'Poppins'; src:url('../fonts/Poppins-Bold.ttf'); font-weight:700; }
@font-face { font-family:'Nunito'; src:url('../fonts/Nunito.ttf'); font-weight:400 800; }

:root{
  /* Rosa Coach Ro */
  --rosa:        #FF4F97;
  --rosa-vivo:   #FF2E86;
  --rosa-pastel: #FFD9EC;
  --rosa-nube:   #FFEBF4;
  /* Arcoíris pastel */
  --lila:        #C6B2FF;
  --menta:       #9FE7DC;
  --celeste:     #B9E4FF;
  --amarillo:    #FFDE7A;
  /* Neutros */
  --crema:       #FFF7FB;
  --carbon:      #2A2028;
  --blanco:      #FFFFFF;

  --grad-arcoiris: linear-gradient(100deg,#FF4F97 0%,#C6B2FF 38%,#B9E4FF 68%,#9FE7DC 100%);
  --grad-rosa:     linear-gradient(160deg,#FF6FAC 0%,#FF2E86 100%);
  --grad-nube:     linear-gradient(165deg,#FFF7FB 0%,#FFE6F3 55%,#F3ECFF 100%);

  --sombra-suave: 0 18px 50px rgba(255,79,151,.22);
  --sombra-card:  0 22px 60px rgba(42,32,40,.16);
}

*{ box-sizing:border-box; margin:0; padding:0; -webkit-font-smoothing:antialiased; }

/* Lienzo historia 1080x1920 */
.story{
  width:1080px; height:1920px; position:relative; overflow:hidden;
  font-family:'Poppins',sans-serif; color:var(--carbon);
}

/* Utilidades tipográficas */
.display{ font-family:'Fredoka',sans-serif; font-weight:700; letter-spacing:-.5px; line-height:.98; }
.round{ font-family:'Baloo 2',sans-serif; }
.eyebrow{ font-family:'Poppins',sans-serif; font-weight:700; letter-spacing:6px; text-transform:uppercase; }

/* Marca de agua / firma */
.firma{ font-family:'Poppins'; font-weight:600; letter-spacing:2px; text-transform:uppercase; opacity:.6; font-size:20px; }

/* Sparkles */
.spark{ position:absolute; color:var(--blanco); filter:drop-shadow(0 2px 6px rgba(255,79,151,.4)); }
</style></head><body>
<div class="story" style="background:var(--grad-nube);display:flex;align-items:center;justify-content:center">
  <svg class="spark" style="left:150px;top:300px;width:60px;height:60px;opacity:1;transform:rotate(10deg)" viewBox="0 0 24 24" fill="#FFD9EC"><path d="M12 0c.7 5.5 2.5 8 12 12-9.5 4-11.3 6.5-12 12-.7-5.5-2.5-8-12-12 9.5-4 11.3-6.5 12-12z"/></svg><svg class="spark" style="left:880px;top:360px;width:42px;height:42px;opacity:0.9;transform:rotate(-8deg)" viewBox="0 0 24 24" fill="#C6B2FF"><path d="M12 0c.7 5.5 2.5 8 12 12-9.5 4-11.3 6.5-12 12-.7-5.5-2.5-8-12-12 9.5-4 11.3-6.5 12-12z"/></svg><svg class="spark" style="left:120px;top:1500px;width:50px;height:50px;opacity:0.8;transform:rotate(20deg)" viewBox="0 0 24 24" fill="#9FE7DC"><path d="M12 0c.7 5.5 2.5 8 12 12-9.5 4-11.3 6.5-12 12-.7-5.5-2.5-8-12-12 9.5-4 11.3-6.5 12-12z"/></svg><svg class="spark" style="left:900px;top:1560px;width:64px;height:64px;opacity:0.9;transform:rotate(0deg)" viewBox="0 0 24 24" fill="#FFD9EC"><path d="M12 0c.7 5.5 2.5 8 12 12-9.5 4-11.3 6.5-12 12-.7-5.5-2.5-8-12-12 9.5-4 11.3-6.5 12-12z"/></svg><svg class="spark" style="left:540px;top:220px;width:30px;height:30px;opacity:0.9;transform:rotate(15deg)" viewBox="0 0 24 24" fill="#FF9EC7"><path d="M12 0c.7 5.5 2.5 8 12 12-9.5 4-11.3 6.5-12 12-.7-5.5-2.5-8-12-12 9.5-4 11.3-6.5 12-12z"/></svg>
  <div style="text-align:center">
    <div style="display:inline-flex;flex-direction:column;align-items:center;line-height:1">
      <div style="font-family:'Poppins';font-weight:700;letter-spacing:24.0px;
                  font-size:52.8px;color:var(--carbon);text-transform:uppercase;
                  margin-bottom:-4.8px;margin-left:24.0px">Coach</div>
      <div style="position:relative;display:inline-block">
        <span class="display" style="font-size:288.0px;color:var(--rosa)">Ro</span>
        <svg class="spark" style="left:283.2px;top:-14.399999999999999px;width:81.6px;height:81.6px;opacity:1.0;transform:rotate(0deg)" viewBox="0 0 24 24" fill="var(--rosa)"><path d="M12 0c.7 5.5 2.5 8 12 12-9.5 4-11.3 6.5-12 12-.7-5.5-2.5-8-12-12 9.5-4 11.3-6.5 12-12z"/></svg>
        <svg class="spark" style="left:360.0px;top:81.6px;width:43.199999999999996px;height:43.199999999999996px;opacity:0.8;transform:rotate(0deg)" viewBox="0 0 24 24" fill="var(--rosa)"><path d="M12 0c.7 5.5 2.5 8 12 12-9.5 4-11.3 6.5-12 12-.7-5.5-2.5-8-12-12 9.5-4 11.3-6.5 12-12z"/></svg>
      </div>
      <div style="font-family:'Poppins';font-weight:600;letter-spacing:4.8px;font-size:38.4px;color:var(--rosa);text-transform:uppercase;margin-top:14.399999999999999px">Entrenamos jugando</div><div style="font-family:'Poppins';font-weight:600;letter-spacing:12.0px;font-size:31.2px;color:var(--carbon);opacity:.55;text-transform:uppercase;margin-top:4.8px">Alpha Fitness · Xalapa</div>
    </div></div>
</div></body></html>
