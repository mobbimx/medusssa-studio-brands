<!doctype html><html lang="es"><head><meta charset="utf-8">
<style>/* ==========================================================================
   COACH RO — Sistema de marca personal · Medusssa Studio
   Hoja de estilos compartida para plantillas de historias y overlays.
   ========================================================================== */

@font-face { font-family:'Fredoka'; src:url('../fonts/Fredoka-Bold.ttf'); font-weight:600 700; }
@font-face { font-family:'Baloo 2'; src:url('../fonts/Baloo2.ttf'); font-weight:400 800; }
@font-face { font-family:'Poppins'; src:url('../fonts/Poppins-Regular.ttf'); font-weight:400; }
@font-face { font-family:'Poppins'; src:url('../fonts/Poppins-SemiBold.ttf'); font-weight:600; }
@font-face { font-family:'Poppins'; src:url('../fonts/Poppins-Bold.ttf'); font-weight:700; }
@font-face { font-family:'Nunito'; src:url('../fonts/Nunito.ttf'); font-weight:400 800; }

:root{
  /* Rosa Coach Ro */
  --rosa:        #FF4F97;
  --rosa-vivo:   #FF2E86;
  --rosa-pastel: #FFD9EC;
  --rosa-nube:   #FFEBF4;
  /* Arcoíris pastel */
  --lila:        #C6B2FF;
  --menta:       #9FE7DC;
  --celeste:     #B9E4FF;
  --amarillo:    #FFDE7A;
  /* Neutros */
  --crema:       #FFF7FB;
  --carbon:      #2A2028;
  --blanco:      #FFFFFF;

  --grad-arcoiris: linear-gradient(100deg,#FF4F97 0%,#C6B2FF 38%,#B9E4FF 68%,#9FE7DC 100%);
  --grad-rosa:     linear-gradient(160deg,#FF6FAC 0%,#FF2E86 100%);
  --grad-nube:     linear-gradient(165deg,#FFF7FB 0%,#FFE6F3 55%,#F3ECFF 100%);

  --sombra-suave: 0 18px 50px rgba(255,79,151,.22);
  --sombra-card:  0 22px 60px rgba(42,32,40,.16);
}

*{ box-sizing:border-box; margin:0; padding:0; -webkit-font-smoothing:antialiased; }

/* Lienzo historia 1080x1920 */
.story{
  width:1080px; height:1920px; position:relative; overflow:hidden;
  font-family:'Poppins',sans-serif; color:var(--carbon);
}

/* Utilidades tipográficas */
.display{ font-family:'Fredoka',sans-serif; font-weight:700; letter-spacing:-.5px; line-height:.98; }
.round{ font-family:'Baloo 2',sans-serif; }
.eyebrow{ font-family:'Poppins',sans-serif; font-weight:700; letter-spacing:6px; text-transform:uppercase; }

/* Marca de agua / firma */
.firma{ font-family:'Poppins'; font-weight:600; letter-spacing:2px; text-transform:uppercase; opacity:.6; font-size:20px; }

/* Sparkles */
.spark{ position:absolute; color:var(--blanco); filter:drop-shadow(0 2px 6px rgba(255,79,151,.4)); }
</style></head><body>
<div class="story" style="background:transparent">
  <div style="position:absolute;left:44px;bottom:180px;
       background:rgba(255,255,255,.94);border-radius:36px;padding:34px 40px;
       box-shadow:var(--sombra-card);display:inline-flex;align-items:center;gap:26px">
    <div style="text-align:center">
    <div style="display:inline-flex;flex-direction:column;align-items:center;line-height:1">
      <div style="font-family:'Poppins';font-weight:700;letter-spacing:5.5px;
                  font-size:12.100000000000001px;color:var(--carbon);text-transform:uppercase;
                  margin-bottom:-1.1px;margin-left:5.5px">Coach</div>
      <div style="position:relative;display:inline-block">
        <span class="display" style="font-size:66.0px;color:var(--rosa)">Ro</span>
        <svg class="spark" style="left:64.9px;top:-3.3000000000000003px;width:18.700000000000003px;height:18.700000000000003px;opacity:1.0;transform:rotate(0deg)" viewBox="0 0 24 24" fill="var(--rosa)"><path d="M12 0c.7 5.5 2.5 8 12 12-9.5 4-11.3 6.5-12 12-.7-5.5-2.5-8-12-12 9.5-4 11.3-6.5 12-12z"/></svg>
        <svg class="spark" style="left:82.5px;top:18.700000000000003px;width:9.9px;height:9.9px;opacity:0.8;transform:rotate(0deg)" viewBox="0 0 24 24" fill="var(--rosa)"><path d="M12 0c.7 5.5 2.5 8 12 12-9.5 4-11.3 6.5-12 12-.7-5.5-2.5-8-12-12 9.5-4 11.3-6.5 12-12z"/></svg>
      </div>
      
    </div></div>
    <div style="width:2px;height:120px;background:var(--rosa-pastel)"></div>
    <div style="display:flex;flex-direction:column;gap:14px">
      <div style="display:flex;align-items:center;gap:14px"><svg viewBox="0 0 24 24" width="40" height="40" style="display:block"><path d="M12 2a10 10 0 0 0-8.6 15l-1.3 4.6 4.7-1.2A10 10 0 1 0 12 2z" fill="none" stroke="var(--rosa-vivo)" stroke-width="2.4"/><path d="M8.5 7.5c-.4 0-.8.2-1 .6-.3.5-.6 1.3-.2 2.4.5 1.5 1.7 3.2 3.4 4.4 1.9 1.4 3.4 1.6 4.2 1.4.7-.2 1.2-.9 1.3-1.4.1-.4 0-.6-.2-.8l-1.7-.9c-.2-.1-.5-.1-.7.2l-.5.7c-.1.1-.3.2-.5.1a5.6 5.6 0 0 1-2.8-2.6c-.1-.2 0-.4.1-.5l.5-.5c.2-.2.2-.4.1-.6l-.7-1.6c-.1-.3-.4-.4-.6-.4z" fill="var(--rosa-vivo)"/></svg>
        <span style="font-family:'Poppins';font-weight:700;font-size:34px;color:var(--carbon)">228 127 19 74</span></div>
      <div style="display:flex;align-items:center;gap:14px"><svg viewBox="0 0 24 24" width="36" height="36" style="display:block"><rect x="3" y="3" width="18" height="18" rx="5.5" fill="none" stroke="var(--rosa-vivo)" stroke-width="2.4"/><circle cx="12" cy="12" r="4" fill="none" stroke="var(--rosa-vivo)" stroke-width="2.4"/><circle cx="17.2" cy="6.8" r="1.3" fill="var(--rosa-vivo)"/></svg>
        <span style="font-family:'Poppins';font-weight:600;font-size:30px;color:var(--carbon)">@alphafitness.kids</span></div>
    </div>
  </div>
</div></body></html>
