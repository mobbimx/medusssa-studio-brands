<!doctype html><html><head><meta charset="utf-8"><style>
@font-face { font-family:'BrandTitle'; src: local('Bahnschrift SemiBold'), local('Bahnschrift'); }
* { margin:0; padding:0; box-sizing:border-box; }
html,body { width:1080px; height:1920px; overflow:hidden; }
.stage { position:relative; width:1080px; height:1920px; background:#0A0A0A; font-family:'Segoe UI',sans-serif; overflow:hidden; }
.bg { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
.overlay { position:absolute; inset:0;
  background:
    linear-gradient(180deg, rgba(10,10,10,.55) 0%, rgba(10,10,10,0) 28%, rgba(10,10,10,.15) 55%, rgba(10,10,10,.82) 82%, rgba(10,10,10,.96) 100%),
    radial-gradient(120% 80% at 50% 40%, rgba(0,0,0,0) 40%, rgba(0,0,0,.45) 100%);
}
/* top bar */
.top { position:absolute; top:70px; left:80px; right:80px; display:flex; align-items:center; justify-content:space-between; }
.iso { height:96px; filter: drop-shadow(0 2px 8px rgba(0,0,0,.6)); }
.wordmark { font-family:'BrandTitle'; font-style:italic; font-weight:700; letter-spacing:2px;
  font-size:30px; color:#fff; opacity:.85; text-transform:uppercase; }
.wordmark b { color:#F8D808; }
/* content */
.content { position:absolute; left:80px; right:80px; bottom:150px; }
.accent { width:120px; height:8px; background:#F8D808; border-radius:4px; margin-bottom:34px;
  box-shadow:0 0 24px rgba(248,216,8,.55); }
.eyebrow { font-family:'BrandTitle'; font-style:italic; font-weight:700; text-transform:uppercase;
  letter-spacing:6px; font-size:34px; color:#F8D808; margin-bottom:18px; }
.title { font-family:'BrandTitle'; font-style:italic; font-weight:700; text-transform:uppercase;
  color:#fff; font-size:150px; line-height:.92; letter-spacing:-1px;
  text-shadow:0 4px 30px rgba(0,0,0,.75); white-space:pre-line; }
.title .hl { color:#F8D808; }
.sub { font-size:40px; color:#f2f2f2; margin-top:26px; font-weight:400; line-height:1.25;
  text-shadow:0 2px 14px rgba(0,0,0,.8); max-width:820px; }
/* cta */
.cta { display:inline-flex; align-items:center; gap:18px; margin-top:46px;
  background:#F8D808; color:#0A0A0A; font-weight:700; font-size:38px; letter-spacing:.5px;
  padding:26px 44px; border-radius:60px; box-shadow:0 10px 40px rgba(248,216,8,.35);
  text-transform:uppercase; font-family:'Segoe UI',sans-serif; }
.cta .wa { width:46px; height:46px; border-radius:50%; background:#0A0A0A; color:#F8D808;
  display:flex; align-items:center; justify-content:center; font-size:26px; }
/* footer field hint (not part of final art; guides the editor) */
.hint { position:absolute; bottom:56px; left:80px; right:80px; text-align:center;
  font-size:24px; color:rgba(255,255,255,.45); letter-spacing:1px; }
.hint span { color:#F8D808; }
</style></head>
